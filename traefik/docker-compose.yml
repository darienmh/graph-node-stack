services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    environment:
      - CF_DNS_API_TOKEN=${CF_EDIT_ZONE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./acme.json:/acme.json
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
